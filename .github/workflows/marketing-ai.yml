name: Marketing AI With TikTok

on:
  workflow_dispatch:
  schedule:
    # Runs every day at 09:00 KST. GitHub Actions cron uses UTC.
    - cron: "0 0 * * *"

jobs:
  run:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r MarketingAIWithTikTok/requirements.txt

      - name: Validate secrets
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          test -n "$APIFY_TOKEN" || { echo "::error::Missing repository secret: APIFY_TOKEN"; exit 1; }
          test -n "$TELEGRAM_TOKEN" || { echo "::error::Missing repository secret: TELEGRAM_TOKEN"; exit 1; }
          test -n "$TELEGRAM_CHAT_ID" || { echo "::error::Missing repository secret: TELEGRAM_CHAT_ID"; exit 1; }
          test -n "$OPENAI_API_KEY" || { echo "::error::Missing repository secret: OPENAI_API_KEY"; exit 1; }

      - name: Run marketing report
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: gpt-5.5
          SEARCH_QUERY: skincare
          RECENT_UPLOAD_CANDIDATE_COUNT: "30"
          REPORT_ITEM_COUNT: "5"
        run: python MarketingAIWithTikTok/main.py
